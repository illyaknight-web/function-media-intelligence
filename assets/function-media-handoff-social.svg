  <text x="72" y="790" font-family="Georgia,serif" font-size="38" fill="#253548"><tspan x="72">Reliability is a property of what survives</tspan><tspan x="72" dy="56">between people, teams, and systems.</tspan></text><text x="72" y="1000" font-family="ui-monospace,monospace" font-size="19" letter-spacing="2" fill="#9b302b">FUNCTION MEDIA LLC</text>
