<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d">
  <title id="t">The Handoff Is the System social card</title><desc id="d">A publication graphic for Function Media's field note on institutional handoffs.</desc>
  <rect width="1080" height="1080" fill="#f2efe7"/><path d="M0 0h1080v18H0z" fill="#122235"/><text x="72" y="100" font-family="ui-monospace,monospace" font-size="21" letter-spacing="3" fill="#5e6770">FUNCTION MEDIA / SYSTEMS FIELD NOTE</text>
  <text x="72" y="260" font-family="Helvetica,Arial,sans-serif" font-size="112" font-weight="700" letter-spacing="-7" fill="#122235"><tspan x="72" dy="0">The handoff</tspan><tspan x="72" dy="105">is the system.</tspan></text>
  <path d="M72 550h936" stroke="#122235" stroke-width="2"/><rect x="72" y="610" width="155" height="55" fill="#2d5f88"/><rect x="243" y="610" width="120" height="55" fill="#9b302b"/><rect x="379" y="610" width="150" height="55" fill="#3f6f57"/><rect x="545" y="610" width="155" height="55" fill="#b17828"/><rect x="716" y="610" width="220" height="55" fill="#122235"/>
