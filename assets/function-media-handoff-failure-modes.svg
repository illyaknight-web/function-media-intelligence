<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">Five failure modes at the seam</title><desc id="d">An editorial diagnostic showing five common ways context is lost between institutional systems.</desc>
  <rect width="1200" height="760" fill="#122235"/><text x="70" y="80" font-family="Helvetica,Arial,sans-serif" font-size="54" font-weight="700" fill="#f2efe7">Five failure modes at the seam</text>
  <g font-family="ui-monospace,monospace" font-size="16" fill="#9fb0bc"><text x="72" y="120">FUNCTION MEDIA / HANDOFF DIAGNOSTIC</text></g>
  <g font-family="Helvetica,Arial,sans-serif"><g transform="translate(70 180)"><rect width="500" height="88" fill="#192c40"/><rect width="12" height="88" fill="#2d5f88"/><text x="40" y="38" font-size="23" font-weight="700" fill="#fff">Identity detached</text><text x="40" y="66" font-size="16" fill="#c2cdd4">The record arrives; the basis of the match does not.</text></g><g transform="translate(630 180)"><rect width="500" height="88" fill="#192c40"/><rect width="12" height="88" fill="#9b302b"/><text x="40" y="38" font-size="23" font-weight="700" fill="#fff">State flattened</text><text x="40" y="66" font-size="16" fill="#c2cdd4">A hypothesis is rendered as a final condition.</text></g><g transform="translate(70 310)"><rect width="500" height="88" fill="#192c40"/><rect width="12" height="88" fill="#3f6f57"/><text x="40" y="38" font-size="23" font-weight="700" fill="#fff">Evidence separated</text><text x="40" y="66" font-size="16" fill="#c2cdd4">The finding survives; its source chain disappears.</text></g><g transform="translate(630 310)"><rect width="500" height="88" fill="#192c40"/><rect width="12" height="88" fill="#b17828"/><text x="40" y="38" font-size="23" font-weight="700" fill="#fff">Authority assumed</text><text x="40" y="66" font-size="16" fill="#c2cdd4">Information access is mistaken for decision rights.</text></g><g transform="translate(350 440)"><rect width="500" height="88" fill="#f2efe7"/><rect width="12" height="88" fill="#9b302b"/><text x="40" y="38" font-size="23" font-weight="700" fill="#122235">Ownership diffused</text><text x="40" y="66" font-size="16" fill="#4d5963">A notification is sent, but no one accepts custody.</text></g></g>
  <path d="M70 650h1060" stroke="#6c7b87"/><text x="70" y="700" font-family="Georgia,serif" font-size="24" fill="#f2efe7">The payload can arrive intact while the meaning arrives damaged.</text>
</svg>
