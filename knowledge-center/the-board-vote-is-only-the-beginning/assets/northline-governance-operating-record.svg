<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Governance and operating record by role</title>
  <desc id="desc">A layered diagram showing the distinct questions available to school boards, district leadership, principals, and educators.</desc>
  <rect width="1400" height="820" fill="#0a2232"/>
  <text x="72" y="88" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#77d9c3">NORTHLINE™ · GOVERNANCE LEDGER</text>
  <text x="72" y="144" font-family="Georgia, serif" font-size="46" font-weight="700" fill="white">One record. Different authority.</text>
  <text x="72" y="184" font-family="Arial, sans-serif" font-size="20" fill="#c7d7df">Each role sees the evidence needed for its work—not the same dashboard.</text>
  <g font-family="Arial, sans-serif">
    <rect x="72" y="240" width="1256" height="112" rx="18" fill="#f2eee3"/>
    <text x="108" y="285" font-size="24" font-weight="700" fill="#0a2232">SCHOOL BOARD</text><text x="108" y="322" font-size="20" fill="#405565">Was the approved purpose met? What supports renewal, change or retirement?</text>
    <rect x="128" y="376" width="1200" height="112" rx="18" fill="#d9e8e2"/>
    <text x="164" y="421" font-size="24" font-weight="700" fill="#0a2232">SUPERINTENDENT · CABINET</text><text x="164" y="458" font-size="20" fill="#405565">Where are implementation, budget, policy or districtwide risks diverging?</text>
    <rect x="184" y="512" width="1144" height="112" rx="18" fill="#8ccabb"/>
    <text x="220" y="557" font-size="24" font-weight="700" fill="#0a2232">PRINCIPALS · OPERATIONS</text><text x="220" y="594" font-size="20" fill="#163b46">What is blocking safe, useful operation in this school today?</text>
    <rect x="240" y="648" width="1088" height="112" rx="18" fill="#d99548"/>
    <text x="276" y="693" font-size="24" font-weight="700" fill="#142936">EDUCATORS · SUPPORT STAFF</text><text x="276" y="730" font-size="20" fill="#142936">What do I need to serve students—and where do I record a problem?</text>
  </g>
</svg>

