<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Decision lineage from source to durable record</title><desc id="desc">Two sources create competing claims, which are reviewed under role-based authority before an action and durable case state are recorded.</desc>
  <rect width="1440" height="820" fill="#111820"/><text x="92" y="92" font-family="Arial,sans-serif" font-size="18" letter-spacing="5" fill="#83AFC4">DECISION LINEAGE</text>
  <text x="92" y="162" font-family="Georgia,serif" font-size="52" fill="#F2EBDD">Keep the path, not only the answer.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(90 274)"><rect width="240" height="132" rx="8" fill="#F2EBDD"/><text x="24" y="42" font-size="14" letter-spacing="2" fill="#526574">SOURCE 01</text><text x="24" y="82" font-size="23" font-weight="700" fill="#111820">Initial claim</text><text x="24" y="108" font-size="15" fill="#526574">Observed 09:12</text></g>
    <g transform="translate(90 458)"><rect width="240" height="132" rx="8" fill="#F2EBDD"/><text x="24" y="42" font-size="14" letter-spacing="2" fill="#526574">SOURCE 02</text><text x="24" y="82" font-size="23" font-weight="700" fill="#111820">Contrary evidence</text><text x="24" y="108" font-size="15" fill="#526574">Received 11:46</text></g>
    <path d="M330 340H460M330 524H460" stroke="#83AFC4" stroke-width="3"/><path d="M460 340l-14-8v16zM460 524l-14-8v16z" fill="#83AFC4"/>
    <g transform="translate(460 310)"><rect width="250" height="250" rx="125" fill="#EF6A3A"/><text x="125" y="93" text-anchor="middle" font-size="15" letter-spacing="2" fill="#111820">REVIEW</text><text x="125" y="132" text-anchor="middle" font-size="25" font-weight="700" fill="#111820">Compare claims</text><text x="125" y="164" text-anchor="middle" font-size="17" fill="#111820">preserve uncertainty</text><text x="125" y="192" text-anchor="middle" font-size="17" fill="#111820">verify authority</text></g>
    <path d="M710 435H836" stroke="#F2EBDD" stroke-width="3"/><path d="M836 435l-14-8v16z" fill="#F2EBDD"/>
    <g transform="translate(836 348)"><rect width="220" height="174" rx="8" fill="#83AFC4"/><text x="25" y="48" font-size="14" letter-spacing="2" fill="#111820">AUTHORIZED ACTION</text><text x="25" y="91" font-size="24" font-weight="700" fill="#111820">Narrow scope</text><text x="25" y="124" font-size="17" fill="#111820">Decision 14:03</text><text x="25" y="150" font-size="15" fill="#111820">Reason retained</text></g>
    <path d="M1056 435H1170" stroke="#F2EBDD" stroke-width="3"/><path d="M1170 435l-14-8v16z" fill="#F2EBDD"/>
    <g transform="translate(1170 348)"><rect width="190" height="174" rx="8" fill="#F2EBDD"/><text x="22" y="48" font-size="14" letter-spacing="2" fill="#526574">CASE STATE</text><text x="22" y="91" font-size="24" font-weight="700" fill="#111820">Resolved</text><text x="22" y="124" font-size="15" fill="#526574">with chronology,</text><text x="22" y="149" font-size="15" fill="#526574">source and authority</text></g>
  </g>
  <text x="92" y="730" font-family="Georgia,serif" font-size="27" fill="#F2EBDD">A clean outcome. A reviewable history.</text><text x="1172" y="755" font-family="Arial,sans-serif" font-size="15" letter-spacing="2" fill="#83AFC4">FUNCTION MEDIA LLC</text>
</svg>
