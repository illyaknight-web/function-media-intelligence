<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">The five layers of a defensible case</title><desc id="desc">Five numbered evidence cards show identity, chronology, provenance, authority and transition converging into one reviewable case.</desc>
  <rect width="1440" height="860" fill="#F2EBDD"/><path d="M88 122h1264" stroke="#111820" stroke-width="2"/>
  <text x="88" y="82" font-family="Arial,sans-serif" font-size="20" letter-spacing="5" fill="#526574">FUNCTION MEDIA / FIELD NOTE</text>
  <text x="88" y="180" font-family="Georgia,serif" font-size="58" fill="#111820">The anatomy of a defensible case</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(90 260)"><rect width="238" height="400" rx="6" fill="#111820"/><rect x="0" y="0" width="238" height="15" fill="#EF6A3A"/><text x="25" y="68" font-size="46" fill="#F2EBDD">01</text><text x="25" y="116" font-size="20" font-weight="700" fill="#F2EBDD">IDENTITY</text><text x="25" y="166" font-size="17" fill="#DCE4E7"><tspan x="25" dy="0">Who or what the</tspan><tspan x="25" dy="28">records concern;</tspan><tspan x="25" dy="28">match confidence</tspan><tspan x="25" dy="28">stays visible.</tspan></text></g>
    <g transform="translate(345 260)"><rect width="238" height="400" rx="6" fill="#FFFFFF" stroke="#C9C1B2"/><rect width="238" height="15" fill="#83AFC4"/><text x="25" y="68" font-size="46" fill="#111820">02</text><text x="25" y="116" font-size="20" font-weight="700" fill="#111820">CHRONOLOGY</text><text x="25" y="166" font-size="17" fill="#526574"><tspan x="25">Event, observation,</tspan><tspan x="25" dy="28">ingestion and</tspan><tspan x="25" dy="28">decision times stay</tspan><tspan x="25" dy="28">distinct.</tspan></text></g>
    <g transform="translate(600 260)"><rect width="238" height="400" rx="6" fill="#FFFFFF" stroke="#C9C1B2"/><rect width="238" height="15" fill="#EF6A3A"/><text x="25" y="68" font-size="46" fill="#111820">03</text><text x="25" y="116" font-size="20" font-weight="700" fill="#111820">PROVENANCE</text><text x="25" y="166" font-size="17" fill="#526574"><tspan x="25">Source, collection</tspan><tspan x="25" dy="28">method and material</tspan><tspan x="25" dy="28">transformations</tspan><tspan x="25" dy="28">remain attached.</tspan></text></g>
    <g transform="translate(855 260)"><rect width="238" height="400" rx="6" fill="#FFFFFF" stroke="#C9C1B2"/><rect width="238" height="15" fill="#83AFC4"/><text x="25" y="68" font-size="46" fill="#111820">04</text><text x="25" y="116" font-size="20" font-weight="700" fill="#111820">AUTHORITY</text><text x="25" y="166" font-size="17" fill="#526574"><tspan x="25">Roles determine who</tspan><tspan x="25" dy="28">may see, decide,</tspan><tspan x="25" dy="28">change or release</tspan><tspan x="25" dy="28">information.</tspan></text></g>
    <g transform="translate(1110 260)"><rect width="238" height="400" rx="6" fill="#111820"/><rect width="238" height="15" fill="#EF6A3A"/><text x="25" y="68" font-size="46" fill="#F2EBDD">05</text><text x="25" y="116" font-size="20" font-weight="700" fill="#F2EBDD">TRANSITION</text><text x="25" y="166" font-size="17" fill="#DCE4E7"><tspan x="25">Evidence and reason</tspan><tspan x="25" dy="28">for moving from one</tspan><tspan x="25" dy="28">case state to the</tspan><tspan x="25" dy="28">next.</tspan></text></g>
  </g>
  <path d="M210 704H1230" stroke="#111820" stroke-width="3"/><path d="M1230 704l-16-9v18z" fill="#111820"/>
  <text x="90" y="780" font-family="Georgia,serif" font-size="30" fill="#111820">The status is only the visible edge of the case.</text>
  <text x="1195" y="810" font-family="Arial,sans-serif" font-size="16" letter-spacing="2" fill="#526574">FUNCTION MEDIA LLC</text>
</svg>
