<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Targeted product recheck</title><desc id="d">A changed official notice triggers rechecking only for saved product attributes that may overlap the new scope.</desc><rect width="1200" height="560" fill="#11313a"/><text x="65" y="72" font-family="Georgia" font-size="44" fill="white">Recheck what the change can reach.</text><g font-family="Arial"><rect x="70" y="155" width="270" height="220" rx="12" fill="#f5f0e6"/><text x="100" y="205" font-size="18" letter-spacing="2" fill="#41656a">NOTICE UPDATE</text><text x="100" y="265" font-size="23" fill="#11313a">new lots</text><text x="100" y="305" font-size="23" fill="#11313a">new geography</text><text x="100" y="345" font-size="23" fill="#11313a">new identifiers</text><path d="M340 265h120" stroke="#d9a343" stroke-width="6"/><rect x="460" y="155" width="280" height="220" rx="12" fill="#86cfc4"/><text x="490" y="205" font-size="18" letter-spacing="2" fill="#11313a">OVERLAP TEST</text><text x="490" y="270" font-size="23" fill="#11313a">saved attributes</text><text x="490" y="310" font-size="23" fill="#11313a">× changed scope</text><path d="M740 265h120" stroke="#d9a343" stroke-width="6"/><rect x="860" y="155" width="270" height="220" rx="12" fill="#f5f0e6"/><text x="890" y="205" font-size="18" letter-spacing="2" fill="#41656a">TARGETED ACTION</text><text x="890" y="270" font-size="23" fill="#11313a">recheck</text><text x="890" y="310" font-size="23" fill="#11313a">explain why</text><text x="890" y="350" font-size="23" fill="#11313a">preserve history</text></g><text x="65" y="480" font-family="Arial" font-size="16" letter-spacing="3" fill="#86cfc4">NO GLOBAL ALARM · NO SILENT OVERWRITE</text></svg>
