<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Five source freshness states</title><desc id="d">Current, aging, stale, unavailable and superseded records require different actions.</desc><rect width="1200" height="560" fill="#f5f0e6"/><text x="65" y="72" font-family="Georgia" font-size="44" fill="#11313a">Freshness is a decision state.</text><g font-family="Arial"><g transform="translate(65 140)"><rect width="200" height="255" rx="10" fill="#17736e"/><text x="25" y="54" font-size="21" fill="white">CURRENT</text><text x="25" y="98" font-size="16" fill="white">Use with stated</text><text x="25" y="124" font-size="16" fill="white">coverage.</text></g><g transform="translate(280 140)"><rect width="200" height="255" rx="10" fill="#86cfc4"/><text x="25" y="54" font-size="21" fill="#11313a">AGING</text><text x="25" y="98" font-size="16" fill="#11313a">Refresh is due.</text></g><g transform="translate(495 140)"><rect width="200" height="255" rx="10" fill="#d9a343"/><text x="25" y="54" font-size="21" fill="#11313a">STALE</text><text x="25" y="98" font-size="16" fill="#11313a">Do not present</text><text x="25" y="124" font-size="16" fill="#11313a">as current.</text></g><g transform="translate(710 140)"><rect width="200" height="255" rx="10" fill="#fff" stroke="#b7b1a8"/><text x="25" y="54" font-size="20" fill="#11313a">UNAVAILABLE</text><text x="25" y="98" font-size="16" fill="#11313a">Bound the last</text><text x="25" y="124" font-size="16" fill="#11313a">known record.</text></g><g transform="translate(925 140)"><rect width="200" height="255" rx="10" fill="#11313a"/><text x="25" y="54" font-size="20" fill="white">SUPERSEDED</text><text x="25" y="98" font-size="16" fill="white">Newer version</text><text x="25" y="124" font-size="16" fill="white">controls.</text></g></g><text x="65" y="480" font-family="Arial" font-size="16" letter-spacing="3" fill="#41656a">SAFEPLATE™ · SOURCE AGE CHANGES WHAT THE SYSTEM MAY SAY</text></svg>
