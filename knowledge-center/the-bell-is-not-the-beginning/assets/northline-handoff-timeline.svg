<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="t d">
  <title id="t">A morning operational handoff timeline</title>
  <desc id="d">A route exception moves through transportation, communication, school arrival, review, and auditable close.</desc>
  <rect width="1400" height="620" fill="#f3efe6"/>
  <text x="68" y="82" font-family="Georgia,serif" font-size="48" fill="#101923">Context must travel with the handoff.</text>
  <text x="70" y="122" font-family="monospace" font-size="17" fill="#3e6e8e">MORNING EXCEPTION / FIGURE 03</text>
  <path d="M110 340H1290" stroke="#101923" stroke-width="4"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(140 340)"><circle r="24" fill="#d59a32"/><text y="-62" font-size="20" fill="#101923">05:48</text><text y="68" font-size="22" fill="#101923">ROUTE CHANGE</text><text y="98" font-size="16" fill="#5a6268">owner: transport</text></g>
    <g transform="translate(420 340)"><circle r="24" fill="#3e6e8e"/><text y="-62" font-size="20" fill="#101923">06:02</text><text y="68" font-size="22" fill="#101923">FAMILY NOTICE</text><text y="98" font-size="16" fill="#5a6268">state: communicated</text></g>
    <g transform="translate(700 340)"><circle r="24" fill="#7c8e83"/><text y="-62" font-size="20" fill="#101923">07:56</text><text y="68" font-size="22" fill="#101923">SCHOOL ARRIVAL</text><text y="98" font-size="16" fill="#5a6268">state: observed</text></g>
    <g transform="translate(980 340)"><circle r="24" fill="#d59a32"/><text y="-62" font-size="20" fill="#101923">08:18</text><text y="68" font-size="22" fill="#101923">HUMAN REVIEW</text><text y="98" font-size="16" fill="#5a6268">authority: assigned</text></g>
    <g transform="translate(1260 340)"><circle r="30" fill="#101923"/><path d="M-12 0l9 9 19-23" fill="none" stroke="#f3efe6" stroke-width="5"/><text y="-62" font-size="20" fill="#101923">08:31</text><text y="68" font-size="22" fill="#101923">AUDITABLE CLOSE</text><text y="98" font-size="16" fill="#5a6268">reason preserved</text></g>
  </g>
  <text x="70" y="560" font-family="Georgia,serif" font-size="25" fill="#34383c">The next team receives the change, its evidence, its uncertainty, and its owner.</text>
</svg>
