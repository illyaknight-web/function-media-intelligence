<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Coverage statement anatomy</title><desc id="d">Six fields required to interpret a no-result search.</desc><rect width="1200" height="680" fill="#082c3d"/><text x="72" y="90" font-family="Georgia,serif" font-size="52" fill="#f5f0e7">“Not found” needs boundaries.</text><g font-family="Arial,sans-serif" font-size="23"><g fill="#f5f0e7"><text x="80" y="200">01 · SOURCES QUERIED</text><text x="80" y="290">02 · TIME WINDOW</text><text x="80" y="380">03 · IDENTIFIERS USED</text></g><g fill="#6fd1c4"><text x="650" y="200">04 · ACCESS LIMITS</text><text x="650" y="290">05 · SYSTEM AVAILABILITY</text><text x="650" y="380">06 · SEARCH TIME</text></g></g><rect x="72" y="465" width="1056" height="5" fill="#c98a2e"/><text x="72" y="545" font-family="Georgia,serif" font-size="34" font-style="italic" fill="#f5f0e7">Silence is evidence only when the listening conditions are known.</text><text x="72" y="620" font-family="Arial,sans-serif" font-size="20" letter-spacing="4" fill="#9fb8c1">FUNCTION MEDIA LLC</text></svg>
