<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Five evidence states</title><desc id="d">A diagram distinguishing present, missing, unavailable, contradictory, and not applicable evidence.</desc><rect width="1200" height="720" fill="#f5f0e7"/><text x="70" y="95" font-family="Georgia,serif" font-size="54" fill="#082c3d">Absence needs a status.</text><g font-family="Arial,sans-serif" font-size="24" fill="#082c3d"><g transform="translate(70 165)"><rect width="200" height="350" rx="8" fill="#d8eee9"/><text x="28" y="55" font-weight="700">PRESENT</text><text x="28" y="105" font-size="18">Record returned</text><text x="28" y="133" font-size="18">and attributable.</text></g><g transform="translate(285 165)"><rect width="200" height="350" rx="8" fill="#fff" stroke="#c98a2e" stroke-width="3"/><text x="28" y="55" font-weight="700">MISSING</text><text x="28" y="105" font-size="18">Expected, but not</text><text x="28" y="133" font-size="18">in reviewed materials.</text></g><g transform="translate(500 165)"><rect width="200" height="350" rx="8" fill="#e9e3d8"/><text x="28" y="55" font-weight="700">UNAVAILABLE</text><text x="28" y="105" font-size="18">May exist; cannot</text><text x="28" y="133" font-size="18">currently be retrieved.</text></g><g transform="translate(715 165)"><rect width="200" height="350" rx="8" fill="#e2d9d2"/><text x="28" y="55" font-weight="700">CONTRADICTORY</text><text x="28" y="105" font-size="18">Records exist and</text><text x="28" y="133" font-size="18">materially disagree.</text></g><g transform="translate(930 165)"><rect width="200" height="350" rx="8" fill="#dbe7eb"/><text x="28" y="55" font-weight="700">NOT APPLICABLE</text><text x="28" y="105" font-size="18">Not required under</text><text x="28" y="133" font-size="18">the governing rule.</text></g></g><path d="M70 585 H1130" stroke="#6fd1c4" stroke-width="8"/><text x="70" y="640" font-family="Arial,sans-serif" font-size="22" letter-spacing="3" fill="#082c3d">FUNCTION MEDIA LLC · NEGATIVE SPACE EDITION</text></svg>
