<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">School device lifecycle and custody path</title><desc id="d">A circular operational path from acquisition and assignment through use, maintenance, repair, reassignment and retirement.</desc><rect width="1200" height="720" fill="#071825"/><text x="70" y="78" font-family="Arial" font-size="22" letter-spacing="5" fill="#f4b942">NORTHLINE™ / CUSTODY PATH</text><text x="70" y="140" font-family="Arial" font-weight="700" font-size="46" fill="white">The purchase order starts a lifecycle.</text><g fill="none" stroke="#5f87a3" stroke-width="8"><path d="M195 325 H1000"/><path d="M1000 325 C1080 325 1080 540 965 540 H220 C105 540 105 325 195 325"/></g><g font-family="Arial" text-anchor="middle"><g fill="#f4b942"><circle cx="195" cy="325" r="58"/><circle cx="395" cy="325" r="58"/><circle cx="595" cy="325" r="58"/><circle cx="795" cy="325" r="58"/><circle cx="995" cy="325" r="58"/></g><g fill="#071825" font-size="18" font-weight="700"><text x="195" y="319">ACQUIRE</text><text x="195" y="342">+ RECORD</text><text x="395" y="319">ASSIGN</text><text x="395" y="342">+ CONFIGURE</text><text x="595" y="319">USE</text><text x="595" y="342">+ OBSERVE</text><text x="795" y="319">MAINTAIN</text><text x="795" y="342">+ UPDATE</text><text x="995" y="319">REPAIR</text><text x="995" y="342">+ LOANER</text></g><rect x="410" y="495" width="370" height="90" rx="18" fill="#a9c9df"/><text x="595" y="533" font-size="20" font-weight="700" fill="#071825">REASSIGN OR RETIRE</text><text x="595" y="560" font-size="17" fill="#29485e">preserve custody and final state</text></g><text x="70" y="655" font-family="Arial" font-size="21" fill="#c8d6df">Every transition needs an accountable record—not an overwritten status.</text></svg>
