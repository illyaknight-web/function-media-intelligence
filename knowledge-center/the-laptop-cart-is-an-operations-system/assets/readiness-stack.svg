<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Seven device readiness states</title><desc id="d">A layered diagram showing asset, power, identity, software, network, accessibility and support states combining into classroom readiness.</desc><rect width="1200" height="720" fill="#f4efe4"/><text x="70" y="80" font-family="Arial" font-size="22" letter-spacing="5" fill="#2d5f85">NORTHLINE™ / READINESS STACK</text><text x="70" y="142" font-family="Arial" font-weight="700" font-size="48" fill="#071825">One device. Seven operating states.</text><g font-family="Arial" font-weight="700" font-size="24" fill="#071825"><rect x="75" y="205" width="150" height="310" rx="16" fill="#f4b942"/><text x="109" y="365" transform="rotate(-90 109 365)">CLASSROOM READY</text><rect x="255" y="205" width="820" height="42" rx="8" fill="#9bc4de"/><text x="280" y="234">ASSET — known, assigned, present</text><rect x="255" y="260" width="760" height="42" rx="8" fill="#a8d7cc"/><text x="280" y="289">POWER — charged for expected use</text><rect x="255" y="315" width="700" height="42" rx="8" fill="#b9cdea"/><text x="280" y="344">IDENTITY — authorized access works</text><rect x="255" y="370" width="640" height="42" rx="8" fill="#d7c7ea"/><text x="280" y="399">SOFTWARE — current and configured</text><rect x="255" y="425" width="580" height="42" rx="8" fill="#e9d2b4"/><text x="280" y="454">NETWORK — required services reachable</text><rect x="255" y="480" width="520" height="42" rx="8" fill="#f2b9aa"/><text x="280" y="509">ACCESSIBILITY — approved tools available</text><rect x="255" y="535" width="460" height="42" rx="8" fill="#b7bec8"/><text x="280" y="564">SUPPORT — repair and loaner state known</text></g><text x="75" y="650" font-family="Arial" font-size="21" fill="#48616e">Inventory alone cannot represent readiness. Each state needs source, time and responsible review.</text></svg>
