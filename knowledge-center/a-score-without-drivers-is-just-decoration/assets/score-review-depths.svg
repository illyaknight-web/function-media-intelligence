<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d"><title id="t">Three depths of score review</title><desc id="d">Summary, evidence, and audit views reveal progressively deeper information for authorized roles.</desc><rect width="1200" height="540" fill="#102d36"/><text x="70" y="78" font-family="Georgia" font-size="42" fill="white">One score. Three review depths.</text><g transform="translate(70 145)"><rect width="310" height="275" rx="8" fill="#f5f0e6"/><text x="28" y="48" font-family="Arial" font-size="15" letter-spacing="3" fill="#49646a">01 · SUMMARY</text><text x="28" y="112" font-family="Georgia" font-size="52" fill="#102d36">72 ↗</text><text x="28" y="160" font-family="Arial" font-size="19" fill="#102d36">direction</text><text x="28" y="192" font-family="Arial" font-size="19" fill="#102d36">top drivers</text><text x="28" y="224" font-family="Arial" font-size="19" fill="#102d36">next review</text></g><g transform="translate(445 145)"><rect width="310" height="275" rx="8" fill="#f5f0e6"/><text x="28" y="48" font-family="Arial" font-size="15" letter-spacing="3" fill="#49646a">02 · EVIDENCE</text><text x="28" y="105" font-family="Arial" font-size="19" fill="#102d36">source + timestamp</text><text x="28" y="145" font-family="Arial" font-size="19" fill="#102d36">record status</text><text x="28" y="185" font-family="Arial" font-size="19" fill="#102d36">coverage limits</text><text x="28" y="225" font-family="Arial" font-size="19" fill="#102d36">open contradictions</text></g><g transform="translate(820 145)"><rect width="310" height="275" rx="8" fill="#f5f0e6"/><text x="28" y="48" font-family="Arial" font-size="15" letter-spacing="3" fill="#49646a">03 · AUDIT</text><text x="28" y="105" font-family="Arial" font-size="19" fill="#102d36">calculation version</text><text x="28" y="145" font-family="Arial" font-size="19" fill="#102d36">rule history</text><text x="28" y="185" font-family="Arial" font-size="19" fill="#102d36">override lineage</text><text x="28" y="225" font-family="Arial" font-size="19" fill="#102d36">authorized actions</text></g><path d="M380 283h65M755 283h65" stroke="#7bd8c7" stroke-width="5"/><text x="70" y="485" font-family="Arial" font-size="15" letter-spacing="2" fill="#7bd8c7">DEPTH FOLLOWS ROLE · EXPLANATION FOLLOWS AUTHORITY</text></svg>
