<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">VERISCOPE driver ledger</title><desc id="d">Six evidence fields connect to a reviewable score and remain separate from human authority.</desc><rect width="1200" height="620" fill="#f5f0e6"/><text x="70" y="78" font-family="Georgia" font-size="44" fill="#102d36">The driver ledger</text><text x="70" y="112" font-family="Arial" font-size="17" letter-spacing="3" fill="#49646a">WHAT MOVED THE NUMBER?</text><g font-family="Arial" font-size="20" fill="#102d36"><g transform="translate(70 165)"><rect width="285" height="88" rx="8" fill="#fff" stroke="#7bd8c7" stroke-width="4"/><text x="24" y="38">OBSERVATION</text><text x="24" y="66" font-size="15" fill="#49646a">event, record, exception</text></g><g transform="translate(70 278)"><rect width="285" height="88" rx="8" fill="#fff"/><text x="24" y="38">SOURCE + TIME</text><text x="24" y="66" font-size="15" fill="#49646a">lineage and freshness</text></g><g transform="translate(70 391)"><rect width="285" height="88" rx="8" fill="#fff"/><text x="24" y="38">COVERAGE</text><text x="24" y="66" font-size="15" fill="#49646a">what was and was not checked</text></g><g transform="translate(435 165)"><rect width="285" height="88" rx="8" fill="#fff"/><text x="24" y="38">RULE + VERSION</text><text x="24" y="66" font-size="15" fill="#49646a">configured interpretation</text></g><g transform="translate(435 278)"><rect width="285" height="88" rx="8" fill="#fff"/><text x="24" y="38">WEIGHT</text><text x="24" y="66" font-size="15" fill="#49646a">contribution, not meaning</text></g><g transform="translate(435 391)"><rect width="285" height="88" rx="8" fill="#fff"/><text x="24" y="38">THRESHOLD</text><text x="24" y="66" font-size="15" fill="#49646a">routing boundary</text></g></g><path d="M750 322h90" stroke="#d49b42" stroke-width="6"/><circle cx="925" cy="322" r="88" fill="#102d36"/><text x="925" y="307" text-anchor="middle" font-family="Georgia" font-size="64" fill="white">72</text><text x="925" y="343" text-anchor="middle" font-family="Arial" font-size="15" letter-spacing="2" fill="#7bd8c7">REVIEW SIGNAL</text><path d="M1013 322h82" stroke="#d49b42" stroke-width="6"/><text x="1100" y="287" text-anchor="middle" font-family="Arial" font-size="16" fill="#102d36">HUMAN</text><text x="1100" y="311" text-anchor="middle" font-family="Arial" font-size="16" fill="#102d36">AUTHORITY</text><rect x="1042" y="338" width="116" height="56" rx="28" fill="#7bd8c7"/><text x="1100" y="373" text-anchor="middle" font-family="Arial" font-size="15" fill="#102d36">SEPARATE</text><text x="70" y="565" font-family="Arial" font-size="15" letter-spacing="2" fill="#49646a">VERISCOPE™ · FUNCTION MEDIA LLC</text></svg>
