<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Notice-to-kitchen evidence path</title><desc id="d">Four stages show how official source evidence becomes a household action while provenance remains attached.</desc><rect width="1400" height="760" fill="#f4efe3"/><text x="80" y="92" font-family="Arial" font-size="24" font-weight="700" fill="#173c36">FUNCTION MEDIA LLC / SAFEPLATE™</text><text x="80" y="142" font-family="Georgia" font-size="54" fill="#15231f">The notice must keep its evidence</text><path d="M160 370H1240" stroke="#b9ab91" stroke-width="8"/><g font-family="Arial" text-anchor="middle"><g transform="translate(180 300)"><circle cx="0" cy="70" r="72" fill="#173c36"/><text y="62" font-size="20" fill="white">OFFICIAL</text><text y="90" font-size="20" fill="white">SOURCE</text><text y="190" font-size="18" fill="#173c36">Authority · time · revision</text></g><g transform="translate(525 300)"><circle cx="0" cy="70" r="72" fill="#de6b48"/><text y="62" font-size="20" fill="white">IDENTIFIER</text><text y="90" font-size="20" fill="white">MATCH</text><text y="190" font-size="18" fill="#173c36">Lot · date · UPC · size</text></g><g transform="translate(875 300)"><circle cx="0" cy="70" r="72" fill="#e7b84f"/><text y="62" font-size="20" fill="#15231f">HUMAN</text><text y="90" font-size="20" fill="#15231f">REVIEW</text><text y="190" font-size="18" fill="#173c36">Match · mismatch · unknown</text></g><g transform="translate(1220 300)"><circle cx="0" cy="70" r="72" fill="#4b806f"/><text y="62" font-size="20" fill="white">HOUSEHOLD</text><text y="90" font-size="20" fill="white">ACTION</text><text y="190" font-size="18" fill="#173c36">Follow official guidance</text></g></g><rect x="270" y="610" width="860" height="60" rx="6" fill="#173c36"/><text x="700" y="650" font-family="Arial" font-size="22" text-anchor="middle" fill="white">PROVENANCE TRAVELS WITH THE MESSAGE</text></svg>
