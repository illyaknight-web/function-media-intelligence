<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="t d"><title id="t">Household match states</title><desc id="d">Four clearly labeled states separate exact evidence from uncertainty.</desc><rect width="1400" height="820" fill="#173c36"/><text x="80" y="90" font-family="Arial" font-size="24" font-weight="700" fill="#f4efe3">SAFEPLATE™ / HOUSEHOLD DECISION MODEL</text><text x="80" y="150" font-family="Georgia" font-size="54" fill="white">Not every check produces a yes or no</text><g font-family="Arial"><g transform="translate(80 245)"><rect width="590" height="190" rx="12" fill="#4b806f"/><text x="34" y="55" font-size="19" fill="white">01 / EXACT MATCH</text><text x="34" y="105" font-size="30" font-weight="700" fill="white">Identifiers align</text><text x="34" y="150" font-size="19" fill="white">Show evidence and official action</text></g><g transform="translate(730 245)"><rect width="590" height="190" rx="12" fill="#e7b84f"/><text x="34" y="55" font-size="19" fill="#15231f">02 / NEEDS REVIEW</text><text x="34" y="105" font-size="30" font-weight="700" fill="#15231f">Some fields align</text><text x="34" y="150" font-size="19" fill="#15231f">Ask the person to verify</text></g><g transform="translate(80 485)"><rect width="590" height="190" rx="12" fill="#607075"/><text x="34" y="55" font-size="19" fill="white">03 / OUTSIDE SCOPE</text><text x="34" y="105" font-size="30" font-weight="700" fill="white">Evidence does not align</text><text x="34" y="150" font-size="19" fill="white">Explain which field differs</text></g><g transform="translate(730 485)"><rect width="590" height="190" rx="12" fill="#de6b48"/><text x="34" y="55" font-size="19" fill="white">04 / UNRESOLVED</text><text x="34" y="105" font-size="30" font-weight="700" fill="white">A key field is missing</text><text x="34" y="150" font-size="19" fill="white">Do not invent an answer</text></g></g><text x="80" y="750" font-family="Arial" font-size="20" fill="#d8e5df">Color supports the labels; it never replaces them.</text></svg>
