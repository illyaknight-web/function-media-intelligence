name: Article media audit
on:
  push:
    branches: [main]
    paths:
      - "knowledge-center/**"
      - "assets/**"
      - "scripts/validate_article_media.py"
      - ".github/workflows/article-media-audit.yml"
  pull_request:
    paths:
      - "knowledge-center/**"
      - "assets/**"
      - "scripts/validate_article_media.py"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check embedded and social article media
        run: python scripts/validate_article_media.py
