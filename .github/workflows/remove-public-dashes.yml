name: Remove public copy dashes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove dashes from public facing copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          ROOT = Path('.')
          TEXT_EXTS = {'.html','.htm','.md','.txt','.svg','.xml'}
          SKIP_PARTS = {'.git','node_modules','.github'}
          DASH_CHARS = '\u2010\u2011\u2012\u2013\u2014\u2212'
          dash_re = re.compile('[' + DASH_CHARS + ']')
          interword_hyphen = re.compile(r'(?<=[A-Za-z0-9])-(?=[A-Za-z0-9])')
          url_re = re.compile(r'https?://[^\s<>)\]"\']+')

          def clean_plain(s: str) -> str:
              s = dash_re.sub(' ', s)
              s = interword_hyphen.sub(' ', s)
              s = re.sub(r' {2,}', ' ', s)
              return s

          def clean_md(s: str) -> str:
              urls = []
              def hold(m):
                  urls.append(m.group(0)); return f'__URL_{len(urls)-1}__'
              t = url_re.sub(hold, s)
              t = clean_plain(t)
              for i,u in enumerate(urls):
                  t = t.replace(f'__URL_{i}__', u)
              return t

          def clean_html(s: str) -> str:
              # Remove typographic dashes everywhere because they are not syntax.
              s = dash_re.sub(' ', s)
              # Clean visible/accessibility metadata attributes without touching URLs, ids, classes or code.
              attr_re = re.compile(r'\b(content|alt|title|aria-label|placeholder)=("[^"]*"|\'[^\']*\')', re.I)
              def attr(m):
                  qv = m.group(2); q=qv[0]; val=qv[1:-1]
                  if '://' not in val and not val.startswith('/'):
                      val = clean_plain(val)
                  return f'{m.group(1)}={q}{val}{q}'
              s = attr_re.sub(attr, s)

              # Clean text nodes only. Preserve tag syntax, scripts and styles.
              parts = re.split(r'(<[^>]+>)', s)
              out=[]; in_script=False; in_style=False
              for part in parts:
                  low=part.lower()
                  if part.startswith('<'):
                      if re.match(r'<script\b', low): in_script=True
                      elif re.match(r'</script\b', low): in_script=False
                      elif re.match(r'<style\b', low): in_style=True
                      elif re.match(r'</style\b', low): in_style=False
                      out.append(part)
                  else:
                      out.append(part if (in_script or in_style) else clean_plain(part))
              s=''.join(out)

              # JSON-LD is public metadata; clean prose values but keep URLs and @ids intact.
              def clean_jsonld_block(m):
                  open_tag, body, close_tag = m.group(1), m.group(2), m.group(3)
                  try:
                      obj=json.loads(body)
                      def walk(x):
                          if isinstance(x, dict):
                              return {k: walk(v) for k,v in x.items()}
                          if isinstance(x, list):
                              return [walk(v) for v in x]
                          if isinstance(x, str):
                              if '://' in x or x.startswith('#'):
                                  return x
                              return clean_plain(x)
                          return x
                      body=json.dumps(walk(obj), ensure_ascii=False, separators=(',',':'))
                  except Exception:
                      body=clean_plain(body)
                  return open_tag+body+close_tag
              s=re.sub(r'(<script[^>]*type=["\']application/ld\+json["\'][^>]*>)(.*?)(</script>)', clean_jsonld_block, s, flags=re.I|re.S)
              return s

          changed=[]
          for p in ROOT.rglob('*'):
              if not p.is_file() or any(part in SKIP_PARTS for part in p.parts):
                  continue
              if p.suffix.lower() not in TEXT_EXTS:
                  continue
              try:
                  old=p.read_text(encoding='utf-8')
              except Exception:
                  continue
              if p.suffix.lower() in {'.html','.htm','.svg','.xml'}:
                  new=clean_html(old)
              elif p.suffix.lower() in {'.md','.txt'}:
                  new=clean_md(old)
              else:
                  new=old
              if new != old:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))
          print('\n'.join(changed))
          PY
      - name: Commit only copy cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No public copy dashes found."
            exit 0
          fi
          git config user.name "Function Media Site Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove dashes from public facing copy"
          git push origin main
