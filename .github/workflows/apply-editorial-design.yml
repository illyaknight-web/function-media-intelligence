name: Apply Function Media Editorial Design

on:
  push:
    paths:
      - 'assets/function-media-editorial-2026.css'
      - 'assets/function-media-editorial-2026.js'
      - '.github/workflows/apply-editorial-design.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach editorial design layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="/assets/function-media-editorial-2026.css">'
          js='<script src="/assets/function-media-editorial-2026.js" defer></script>'
          changed=False
          if css not in s:
              s=s.replace('</head>', css+'\n</head>', 1)
              changed=True
          if js not in s:
              s=s.replace('</body>', js+'\n</body>', 1)
              changed=True
          if changed:
              p.write_text(s)
          PY
      - name: Commit upgrade
        run: |
          if git diff --quiet; then
            echo 'Editorial layer already attached.'
            exit 0
          fi
          git config user.name 'function-media-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply editorial technology design to Function Media homepage'
          git push
