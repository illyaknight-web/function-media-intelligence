            insights/veriscope-operational-intelligence/index.html \
            knowledge-center/a-case-is-not-a-row-in-a-database/assets/function-media-decision-lineage.svg \
            knowledge-center/a-case-is-not-a-row-in-a-database/assets/function-media-defensible-case-anatomy.svg \
