name: Repair Function Media rendering
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore technical syntax damaged by dash cleanup
        shell: bash
        run: |
          set -euo pipefail
          git checkout afd06f2 -- \
            PUBLICATIONS.md \
            about.html \
            assets/function-media-handoff-anatomy.svg \
            assets/function-media-handoff-failure-modes.svg \
            assets/function-media-handoff-social.svg \
            googlef5aa5378271f96b6.html \
